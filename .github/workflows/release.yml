name: Release package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to build (must match qpkg.cfg); manual runs never publish'
        required: true
        default: v0.1.0
        type: string

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate version
        run: python3 scripts/release.py validate "$RELEASE_TAG"
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential rsync shellcheck
      - name: Test and lint
        run: make test lint
      - name: Build and verify QPKG
        run: bash scripts/build-release.sh "$RELEASE_TAG"
      - name: Keep build artifacts (also available for manual test runs)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: peach-qnap-${{ env.RELEASE_TAG }}
          path: dist/${{ env.RELEASE_TAG }}/
          if-no-files-found: error
          retention-days: 14
      - name: Publish prerelease for a pushed tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          out="dist/$RELEASE_TAG"
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo 'A published release already exists; refusing to overwrite its assets.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "Peach QNAP $RELEASE_TAG — 测试版" --notes-file "$out/RELEASE_NOTES.md"
          fi
          gh release upload "$RELEASE_TAG" "$out"/*.qpkg "$out"/*-source.tar.gz "$out/SHA256SUMS.txt" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
